.sub{color:#ccdacc}.hero .link{color:#e5d39f;margin-top:24px;position:relative;z-index:1}.hero small{display:block;color:#bccdbd;margin-top:15px}.section-title{font:600 22px 'Playfair Display',Georgia;margin:7px 0 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.divider{border:0;border-top:1px solid #eeeee6;margin:17px 0}.soft{background:#eff3ea;border-radius:12px;padding:13px;margin:14px 0;line-height:1.5}.btn{border:0;background:var(--ink);color:white;border-radius:9px;padding:11px 16px;font-weight:600}.outline{border:1px solid #d8e0d4;background:#fffefa;color:var(--ink);border-radius:9px;padding:10px 14px;font-weight:600}.gold{color:#a78744}.wide{grid-column:1/-1}.stack{display:grid;gap:18px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;font-weight:600}input{width:100%;padding:11px;border:1px solid #d9dfd6;border-radius:9px;background:#fff;color:var(--ink)}.inline{display:flex;gap:8px;align-items:end}.inline>*{flex:1}.inline button{flex:none}.tiny{font-size:12px}.listrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #f0f1eb}.listrow:last-child{border:0}.tag{font-size:11px;color:#718370}.actions{display:flex;gap:6px}.actions button{border:0;background:none;text-decoration:underline;color:#55745b;font-size:12px}.forecast{display:flex;gap:9px;overflow:auto;padding:10px 0}.day{min-width:110px;padding:13px;border-radius:10px;background:#f3f5ef}.day strong{display:block;margin-top:7px}.focus .secondary{display:none}.footer{text-align:center;color:#879488;font-size:11px;margin-top:28px}.modal{position:fixed;inset:0;background:#142a1eb5;display:grid;place-items:center;padding:20px;z-index:5}.dialog{background:var(--cream);border-radius:20px;padding:28px;max-width:470px;width:100%;max-height:90vh;overflow:auto}.hidden{display:none}@media(max-width:750px){.shell{display:block}.sidebar{border:0;border-bottom:1px solid #e6e2d7;padding:18px 22px}.brand{font-size:22px}.brand small,.nav,.side-note{display:none}.main{padding:25px 18px 60px}.top h1{font-size:30px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.banner{align-items:flex-start;flex-direction:column}.hero .amount{font-size:48px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">Daymints<small>YOUR CALM MONEY SPACE</small></div><div class="nav"><div class="active">◉ &nbsp; Today</div></div><div class="side-note">✳<br><b>A little clarity goes a long way.</b><br>One small step at a time.</div></aside><main class="main" id="app"></main></div><div id="modal" class="modal hidden"></div><script>
const KEY='daymints-phase1-v1';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};const today=()=>iso(new Date());const add=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};const days=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);const cents=v=>{let s=String(v).trim();if(!/^\d+(\.\d{1,2})?$/.test(s))return null;let [a,b='']=s.split('.');let n=Number(a)*100+Number((b+'00').slice(0,2));return Number.isSafeInteger(n)?n:null};const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n/100);const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);function example(){return {example:true,title:'My money plan',balance:125000,payday:add(today(),10),bills:[{id:id(),name:'Electricity',amount:8500,date:add(today(),3),paid:false},{id:id(),name:'Internet',amount:6000,date:add(today(),6),paid:false}],spends:[],notes:[],done:false,focus:false}}let state;try{state=JSON.parse(localStorage.getItem(KEY))||example()}catch(e){state=example()}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function due(){return state.bills.filter(b=>!b.paid&&b.date>=today()&&b.date<state.payday)}function remaining(){return state.balance-state.spends.reduce((a,x)=>a+x.amount,0)-due().reduce((a,x)=>a+x.amount,0)}function perDay(){let d=days(today(),state.payday);return d>0?Math.floor(remaining()/d):null}function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}function modal(content){$('#modal').innerHTML='<div class="dialog">'+content+'</div>';$('#modal').classList.remove('hidden')}function showSetup(step=1,data={}){let contents={1:`<h2 class="section-title">Your balance today</h2><p class="muted">Start with the money in your spending account.</p><div class="field"><label>Planner title (optional)</label><input id="title" placeholder="My money plan" value="${esc(data.title||'')}"></div><div class="field"><label>Current balance ($)</label><input id="balance" inputmode="decimal" placeholder="0.00" value="${esc(data.balance||'')}"></div>`,2:`<h2 class="section-title">When is your next payday?</h2><p class="muted">We’ll plan up to, but not including, this day.</p><div class="field"><label>Next payday</label><input id="payday" type="date" min="${add(today(),1)}" value="${esc(data.payday||'')}"></div>`,3:`<h2 class="section-title">Your next bill</h2><p class="muted">Add one bill due before payday, or skip for now. More bill options come in the next phase.</p><div class="field"><label>Bill name</label><input id="billname" placeholder="e.g. Electricity"></div><div class="field"><label>Amount ($)</label><input id="billamount" inputmode="decimal" placeholder="0.00"></div><div class="field"><label>Due date</label><input id="billdate" type="date" min="${today()}"></div>`,4:`<h2 class="section-title">You’re ready for today</h2><p class="muted">Your first number is based on your balance and the bill you entered. You can always change it later.</p><div class="soft">A little progress is still progress. ✳</div>`};modal(`<div class="row"><span class="eyebrow">YOUR SETUP · ${step} OF 4</span><button class="link" onclick="closeModal()">Close</button></div>${contents[step]}<p id="error" class="gold"></p><button class="btn" id="next">${step===4?'See my Today screen':'Continue →'}</button>`);$('#next').onclick=()=>{if(step===1){let n=cents($('#balance').value);if(n===null){$('#error').textContent='Please enter a valid balance, like 250.00.';return}data.balance=n;data.title=$('#title').value.trim()||'My money plan'}if(step===2){data.payday=$('#payday').value;if(!data.payday||data.payday<=today()){$('#error').textContent='Please choose a date after today.';return}}if(step===3){let name=$('#billname').value.trim(),a=$('#billamount').value,date=$('#billdate').value;if(name||a||date){let n=cents(a);if(!name||n===null||!date){$('#error').textContent='Please complete the bill name, amount and date, or leave all three blank.';return}data.bills=[{id:id(),name,amount:n,date,paid:false}]}}if(step<4)showSetup(step+1,data);else{state={example:false,title:data.title,balance:data.balance,payday:data.payday,bills:data.bills||[],spends:[],notes:[],done:false,focus:false};save();closeModal();render()}}}
function breakdown(){let d=days(today(),state.payday),b=due().reduce((a,x)=>a+x.amount,0),sp=state.spends.reduce((a,x)=>a+x.amount,0);modal(`<div class="row"><h2 class="section-title">How it’s worked out</h2><button class="link" onclick="closeModal()">Close</button></div><p class="muted">We divide what remains by the days from today up to your next payday.</p><div class="listrow"><span>Starting balance</span><b>${money(state.balance)}</b></div><div class="listrow"><span>Spending logged</span><b>− ${money(sp)}</b></div><div class="listrow"><span>Unpaid bills before payday</span><b>− ${money(b)}</b></div><div class="listrow"><span>Money coming in / set aside</span><b>Not available in this preview</b></div><div class="listrow"><span>Left for spending</span><b>${money(remaining())}</b></div><div class="listrow"><span>Days until payday</span><b>${Math.max(0,d)}</b></div><div class="soft"><b>${perDay()===null?'Set a future payday to calculate':money(perDay())+' per day'}</b><br><span class="tiny">Rounded down to the nearest cent. A negative number means the plan is short.</span></div>`)}
function logSpend(amount,note){let n=cents(amount);if(n===null||n<=0){alert('Please enter a valid amount greater than zero.');return}state.spends.unshift({id:id(),amount:n,note:note.trim()||'Spending',date:today()});save();render()}function removeSpend(i){state.spends=state.spends.filter(x=>x.id!==i);save();render()}function editSpend(i){let x=state.spends.find(x=>x.id===i),v=prompt('Amount ($)',(x.amount/100).toFixed(2));if(v===null)return;let n=cents(v);if(n===null||n<=0){alert('Please enter a valid amount.');return}let note=prompt('Note',x.note);if(note===null)return;x.amount=n;x.note=note.trim()||'Spending';save();render()}function paid(i){let b=state.bills.find(x=>x.id===i);if(!b.paid){state.balance-=b.amount;b.paid=true}else{state.balance+=b.amount;b.paid=false}save();render()}function doAction(){let v=$('#quick').value.trim(),m=v.match(/^(\d+(?:\.\d{1,2})?)\s+(.+)$/);if(m){logSpend(m[1],m[2]);return}if(v.toLowerCase()==='today'){window.scrollTo({top:0,behavior:'smooth'});$('#quick').value='';return}alert('Try an amount and note, like “12.50 lunch”, or type Today. Other screens are coming later.')}function render(){let n=perDay(),d=days(today(),state.payday);let forecast='';if(d>0&&d<=366){let running=state.balance-state.spends.reduce((a,x)=>a+x.amount,0);for(let i=0;i<d;i++){let date=add(today(),i);running-=state.bills.filter(b=>!b.paid&&b.date===date).reduce((a,b)=>a+b.amount,0);forecast+=`<div class="day"><span class="tag">${esc(new Date(date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}))}</span><strong>${money(running)}</strong><span class="tag">before daily spending</span></div>`}}else forecast='<p class="muted">Choose a payday within the next year to see the forecast.</p>';$('#app').className='main '+(state.focus?'focus':'');$('#app').innerHTML=`<header class="top"><div><div class="eyebrow">YOUR CALM MONEY SPACE</div><h1>Let’s take today gently.</h1><div class="muted">${esc(state.title)} · A little clarity for the days ahead.</div></div><button class="outline" id="focus">${state.focus?'Exit focus':'◌ Focus mode'}</button></header>${state.example?`<div class="banner"><span><b>You're exploring example numbers.</b> Nothing here is your real budget yet.</span><button class="link" id="setup">Start with my own numbers →</button></div>`:`<div class="banner"><span>✳ Your numbers stay in this browser on this device.</span><button class="link" id="setup">Start a new plan</button></div>`}<div class="grid"><section class="card hero"><div class="eyebrow">YOUR DAILY NUMBER</div><div class="amount">${n===null?'—':money(n)}</div><div class="sub">safe to spend per day</div><small>${d>0?d+' days until your next payday':'Please start a new plan with a future payday.'}</small><button class="link" id="breakdown">How is this worked out? ↗</button></section><section class="card"><div class="eyebrow">RIGHT NOW · ONE THING ONLY</div><h2 class="section-title">A small next step</h2><p class="muted">${state.done?'You’ve checked in. Take a breath and carry on.':'Take a moment to check the bills coming up before payday.'}</p><div class="soft">✳ &nbsp; ${state.done?'You’re all caught up for now.':'Have a look at your must-pays below.'}</div><button class="outline" id="done">${state.done?'Show step again':'Done for now ✓'}</button></section><section class="card wide secondary"><div class="row"><div><div class="eyebrow">A LITTLE LOOK AHEAD</div><h2 class="section-title">Run to payday</h2></div><span class="pill">${d>0?d+' days to go':'Payday needs updating'}</span></div><p class="muted tiny">Projected balance after scheduled bills, before any future spending. No future income included.</p><div class="forecast">${forecast}</div></section><section class="card secondary"><div class="eyebrow">KEEP IT SIMPLE</div><h2 class="section-title">Log a little spend</h2><p class="muted tiny">Add what you spent. A note is optional.</p><div class="inline"><div class="field"><label>Amount ($)</label><input id="spendamount" inputmode="decimal" placeholder="0.00"></div><div class="field"><label>Note</label><input id="spendnote" placeholder="e.g. Coffee"></div><button class="btn" id="spend">Add</button></div><div class="actions"><button data-quick="5">+$5</button><button data-quick="10">+$10</button><button data-quick="20">+$20</button></div><hr class="divider"><b class="tiny">RECENT SPENDING</b>${state.spends.length?state.spends.slice(0,10).map(x=>`<div class="listrow"><span>${esc(x.note)}<br><span class="tag">${esc(x.date)}</span></span><span><b>${money(x.amount)}</b><span class="actions"><button onclick="editSpend('${x.id}')">Edit</button><button onclick="removeSpend('${x.id}')">Delete</button></span></span></div>`).join(''):'<p class="muted tiny">No spending logged yet.</p>'}</section><section class="card secondary"><div class="eyebrow">COMING UP</div><h2 class="section-title">Must-pays</h2><p class="muted tiny">Your bills, soonest first. Marking one paid reduces your balance.</p>${state.bills.length?[...state.bills].sort((a,b)=>a.date.localeCompare(b.date)).map(b=>`<div class="listrow"><span><b>${esc(b.name)}</b><br><span class="tag">${esc(b.date)} · ${b.paid?'Paid':'Still to go'}</span></span><span><b>${money(b.amount)}</b> <button class="link tiny" onclick="paid('${b.id}')">${b.paid?'Undo':'Mark paid'}</button></span></div>`).join(''):'<p class="muted tiny">No bills added yet.</p>'}</section><section class="card secondary"><div class="eyebrow">QUICK ACTION</div><h2 class="section-title">A shortcut for your thoughts</h2><p class="muted tiny">Type an amount and a note, like “12.50 lunch”.</p><div class="inline"><input id="quick" placeholder="Try 12.50 lunch"><button class="btn" id="go">Go →</button></div></section><section class="card secondary"><div class="eyebrow">CLEAR SOME HEADSPACE</div><h2 class="section-title">Brain dump</h2><p class="muted tiny">A thought, a reminder, anything. It won’t change your numbers.</p><div class="inline"><input id="thought" placeholder="Get it out of your head"><button class="btn" id="addnote">Add</button></div>${state.notes.map(x=>`<div class="listrow"><span>${esc(x.text)}</span><button class="link tiny" onclick="delNote('${x.id}')">Remove</button></div>`).join('')}</section></div><div class="footer">A gentle planning tool, not financial advice. · Phase 1 preview</div>`;$('#setup').onclick=()=>showSetup();$('#breakdown').onclick=breakdown;$('#focus').onclick=()=>{state.focus=!state.focus;save();render()};$('#done').onclick=()=>{state.done=!state.done;save();render()};$('#spend').onclick=()=>logSpend($('#spendamount').value,$('#spendnote').value);document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{$('#spendamount').value=b.dataset.quick});$('#go').onclick=doAction;$('#quick').onkeydown=e=>{if(e.key==='Enter')doAction()};function note(){let text=$('#thought').value.trim();if(text){state.notes.unshift({id:id(),text});save();render()}}$('#addnote').onclick=note;$('#thought').onkeydown=e=>{if(e.key==='Enter')note()}}function delNote(i){state.notes=state.notes.filter(x=>x.id!==i);save();render()}render();
</script><script>(function(){function c(){var b=a.contentDocument||(a.contentWindow&&a.contentWindow.document);if(b){var d=b.createElement('script');d.innerHTML="window.__CF$cv$params={r:'a5493e860f93ff91',t:'MTc5MzY4NjUyMw=='};var l=window.parent.location,o;try{o=new URL(l.origin).origin}catch(e){try{o=new URL(new URL(l.href).origin).origin}catch(e){o=''}}var u='/cdn-cgi/challenge-platform/scripts/jsd/main.js?ray=a5493e860f93ff91',a=document.createElement('script');a.src=o?new URL(u,o).href:u;document.getElementsByTagName('head')[0].appendChild(a);";b.getElementsByTagName('head')[0].appendChild(d)}}if(document.body){var a=document.createElement('iframe');a.height=1;a.width=1;a.style.position='absolute';a.style.top=0;a.style.left=0;a.style.border='none';a.style.visibility='hidden';document.body.appendChild(a);if('loading'!==document.readyState)c();else if(window.addEventListener)document.addEventListener('DOMContentLoaded',c);else{var e=document.onreadystatechange||function(){};document.onreadystatechange=function(b){e(b);'loading'!==document.readyState&&(document.onreadystatechange=e,c())}}}})();</script></body></html>
